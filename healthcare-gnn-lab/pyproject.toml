[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthcare-gnn-lab"
version = "0.1.0"
description = "Leakage-aware educational graph-learning experiments for healthcare data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "torch>=2.2,<3", "torch-geometric>=2.5,<3",
  "geoopt>=0.5.1,<1", "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
]

[project.optional-dependencies]
data = ["ucimlrepo>=0.0.7,<1", "wfdb>=4.1,<5"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
healthcare-gnn = "healthcare_gnn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_gnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
